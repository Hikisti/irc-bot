name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:  # lets you manually re-run a deploy from the Actions tab

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    # Only for real pushes to main, or a manual re-run - never for PRs
    # (including from forks, which can't see the deploy secrets anyway).
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ircbot
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd "${{ vars.DEPLOY_PATH }}"
            git fetch --all
            git reset --hard origin/main
            # Adjust this if the server's venv isn't named/located ".venv"
            # directly under DEPLOY_PATH.
            "${{ vars.DEPLOY_PATH }}/.venv/bin/pip" install -r requirements.txt
            sudo -n systemctl restart "${{ vars.DEPLOY_SERVICE_NAME }}"
            sleep 2
            sudo -n systemctl is-active "${{ vars.DEPLOY_SERVICE_NAME }}"
