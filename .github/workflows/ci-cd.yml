name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:  # lets you manually re-run a deploy from the Actions tab

# The deploy logs in with its own SSH key (a secret); the workflow token itself only needs to read the code.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests tools

      - name: Run tests
        run: pytest

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    # Only for real pushes to main, or a manual re-run on main - never for PRs
    # (including from forks, which can't see the deploy secrets anyway).
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    # One deploy at a time, in push order: a newer push waits for the running deploy instead of racing it, and
    # a deploy still waiting is replaced by the newer one (#86).
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            # The commit this run tested, not whatever main points at by the time the deploy starts (#86).
            git fetch origin main
            git reset --hard "${{ github.sha }}"
            # A restart drops every channel and stops any running tracker, so a push that changes only files
            # the bot never runs (docs, tests, tools) leaves it running; .github/needs-restart.sh decides and
            # says why. .deployed-commit (untracked, gitignored) is the commit the running bot was started
            # from, written only after a restart succeeded. A manual run, or a bot that is not running, always
            # restarts. `is-active` with no other flag: the deploy user's sudo rule allows exactly that command.
            if [ "${{ github.event_name }}" = workflow_dispatch ]; then
              echo "restart: manual run"
            elif ! sudo -n systemctl is-active "${{ secrets.DEPLOY_SERVICE_NAME }}" >/dev/null; then
              echo "restart: the bot is not running"
            elif ! sh .github/needs-restart.sh "$(cat .deployed-commit 2>/dev/null || true)"; then
              exit 0
            fi
            # Adjust this if the server's venv isn't named/located ".venv"
            # directly under DEPLOY_PATH. "python3 -m pip", not the "pip"
            # script directly - "pip" (and every other installed console
            # script) has its venv's exact creation-time path hardcoded
            # into its shebang line, so it silently breaks if the venv
            # directory is ever renamed/moved after creation (confirmed
            # live: happened when .venv-py314 was mv'd to .venv during
            # the Python 3.14 migration). "python3 -m pip" invokes the
            # interpreter directly instead, which isn't affected.
            "${{ secrets.DEPLOY_PATH }}/.venv/bin/python3" -m pip install -r requirements.txt
            sudo -n systemctl restart "${{ secrets.DEPLOY_SERVICE_NAME }}"
            sleep 2
            sudo -n systemctl is-active "${{ secrets.DEPLOY_SERVICE_NAME }}"
            git rev-parse HEAD > .deployed-commit
